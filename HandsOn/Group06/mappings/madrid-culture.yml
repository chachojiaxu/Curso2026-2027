prefixes:
  mc: http://w3id.org/madrid-culture/ontology/
  res: http://w3id.org/madrid-culture/resource/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#

mappings:
  libraries:
    sources: 
      - [csv/libraries-updated.csv~csv]
    s: res:library/$(PK)
    po:
      - [a, mc:Library]
      - [schema:name, $(NOMBRE)]
      - [schema:openingHours, $(HORARIO), xsd:string]
      - [mc:transport, $(TRANSPORTE), xsd:string]
      - [schema:url, $(CONTENT-URL)~iri]
      - [mc:hasAccessibility, res:accessibility/$(PK)~iri]
      - [mc:hasAddress, res:address/$(PK)~iri]
      - [schema:latitude, $(LATITUD), xsd:decimal]
      - [schema:longitude, $(LONGITUD), xsd:decimal]
      - [schema:telephone, $(TELEFONO), xsd:string]
      - [mc:email, $(EMAIL), xsd:string]
      - [mc:type, $(TIPO), xsd:string]

  museums:
    sources: 
      - [csv/museums-updated.csv~csv]
    s: res:museum/$(PK)
    po:
      - [a, mc:Museum]
      - [schema:name, $(NOMBRE)]
      - [schema:openingHours, $(HORARIO), xsd:string]
      - [mc:transport, $(TRANSPORTE), xsd:string]
      - [schema:url, $(CONTENT-URL)~iri]
      - [mc:hasAccessibility, res:accessibility/$(PK)~iri]
      - [mc:hasAddress, res:address/$(PK)~iri]
      - [schema:latitude, $(LATITUD), xsd:decimal]
      - [schema:longitude, $(LONGITUD), xsd:decimal]
      - [schema:telephone, $(TELEFONO), xsd:string]
      - [mc:email, $(EMAIL), xsd:string]
      - [mc:type, $(TIPO), xsd:string]

  library-accessibility:
    sources:
      - [csv/libraries-updated.csv~csv]
    s: res:accessibility/(PK)
    po:
      - [a, mc:Accessibility]
      - [mc:accessible, $(ACCESIBLE), xsd:boolean]
      - [mc:partiallyAccessible, $(PARCIALMENTE-ACCESIBLE), xsd:boolean]
      - [mc:noInfoAccessibility, $(SIN-INFORMACION-ACCESIBILIDAD), xsd:boolean]
      - [mc:signLanguage, $(LENGUA-SIGNO), xsd:boolean]
      - [mc:tactilePaving, $(SEÑALIZACION-PODOTACTIL), xsd:boolean]
      - [mc:magneticInductionLoop, $(BUCLE-INDUCCION-MAGNETICO), xsd:boolean]

  museum-accessibility:
    sources:
      - [csv/museums-updated.csv~csv]
    s: res:accessibility/(PK)
    po:
      - [a, mc:Accessibility]
      - [mc:accessible, $(ACCESIBLE), xsd:boolean]
      - [mc:partiallyAccessible, $(PARCIALMENTE-ACCESIBLE), xsd:boolean]
      - [mc:noInfoAccessibility, $(SIN-INFORMACION-ACCESIBILIDAD), xsd:boolean]
      - [mc:signLanguage, $(LENGUA-SIGNO), xsd:boolean]
      - [mc:tactilePaving, $(SEÑALIZACION-PODOTACTIL), xsd:boolean]
      - [mc:magneticInductionLoop, $(BUCLE-INDUCCION-MAGNETICO), xsd:boolean]

  library-addresses:
    sources: 
      - [csv/libraries-updated.csv~csv]
    s: res:address/$(PK)
    po:
      - [a, mc:Address]
      - [mc:streetAddress, $(DIRECCION), xsd:string]
      - [mc:postalCode, $(CODIGO-POSTAL), xsd:string]
      - [mc:locatedInDistrict, res:district/$(COD-DISTRITO)~iri]
      - [mc:locatedInNeighborhood, res:neighborhood/$(COD-DISTRITO)-$(COD-BARRIO)~iri]

  museum-addresses:
    sources: 
    - [csv/museums-updated.csv~csv]
    s: res:address/$(PK)
    po:
      - [a, mc:Address]
      - [mc:streetAddress, $(DIRECCION), xsd:string]
      - [mc:postalCode, $(CODIGO-POSTAL), xsd:string]
      - [mc:locatedInDistrict, res:district/$(COD-DISTRITO)~iri]
      - [mc:locatedInNeighborhood, res:neighborhood/$(COD-DISTRITO)-$(COD-BARRIO)~iri]

  library-districts:
    sources: 
      - [csv/libraries-updated.csv~csv]
    s: res:district/$(COD-DISTRITO)
    po:
      - [a, mc:District]
      - [schema:name, $(DISTRITO)]

  museum-districts:
    sources: 
      - [csv/museums-updated.csv~csv]
    s: res:district/$(COD-DISTRITO)
    po:
      - [a, mc:District]
      - [schema:name, $(DISTRITO)]

  library-neighborhoods:
    sources: 
      - [csv/libraries-updated.csv~csv]
    s: res:neighborhood/$(COD-DISTRITO)-$(COD-BARRIO)
    po:
      - [a, mc:Neighborhood]
      - [schema:name, $(BARRIO)]

  museum-neighborhoods:
    sources: [[csv/museums-updated.csv~csv]]
    s: res:neighborhood/$(COD-DISTRITO)-$(COD-BARRIO)
    po:
      - [a, mc:Neighborhood]
      - [schema:name, $(BARRIO)]
